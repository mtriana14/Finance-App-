name: libreta
description: "Libreta — ventas, fiado e historial para comerciantes del Ecuador."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Spanish date pickers and Material strings
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (typed, reactive). v1 is device-local: no server, no sync.
  drift: ^2.28.2
  drift_flutter: ^0.2.4

  # Charts
  fl_chart: ^1.1.1

  # es-EC currency and date formatting
  intl: ^0.20.2

  # CSV export + "compartir resumen" to WhatsApp. Local-only utilities:
  # neither talks to a server, both are needed by Historial/Perfil export.
  path_provider: ^2.1.5
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
